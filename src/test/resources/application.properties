spring.datasource.url=jdbc:mysql://localhost:3306/medical_record_db_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=med_app_user
spring.datasource.password=MedProject123!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# create-drop — схемата се създава при старт и се изтрива след всички тестове
spring.jpa.hibernate.ddl-auto=create-drop
# Скриваме SQL заявките в тест изхода
spring.jpa.show-sql=false
spring.sql.init.mode=never

spring.jackson.serialization.write-dates-as-timestamps=false

