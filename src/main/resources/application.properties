# =============================================
# База данни
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3306/medical_record_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=med_app_user
spring.datasource.password=MedProject123!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# JPA / Hibernate
# =============================================
# "update" — запазва данните между рестартирания (не изтрива схемата)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Не задаваме dialect — Spring Boot 3 го открива автоматично от драйвера
spring.jpa.open-in-view=false

# Данните се вмъкват чрез DataInitializer (@Component), не чрез data.sql
spring.sql.init.mode=never

# =============================================
# Jackson — дати като ISO-8601 стрингове, не timestamps
# =============================================
spring.jackson.serialization.write-dates-as-timestamps=false

# =============================================
# JWT конфигурация
# =============================================
jwt.secret=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
jwt.expiration=86400000

# =============================================
# Сървър
# =============================================
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
