<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Страницата не е намерена</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <style>
        .error-code {
            font-size: 7rem;
            font-weight: 800;
            line-height: 1;
            color: #0d6efd;
            opacity: 0.15;
            user-select: none;
        }
        .error-icon {
            font-size: 4rem;
            line-height: 1;
        }
    </style>
</head>
<body class="bg-light d-flex align-items-center min-vh-100">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow text-center p-4">
                <div class="card-body">
                    <div class="position-relative mb-2">
                        <div class="error-code">404</div>
                        <div class="error-icon position-absolute top-50 start-50 translate-middle">🔍</div>
                    </div>
                    <h3 class="fw-bold mt-3 mb-2">Страницата не е намерена</h3>
                    <p class="text-muted mb-1">
                        Адресът, който търсите, не съществува или е бил преместен.
                    </p>
                    <p class="text-muted small mb-4">
                        Път: <code th:text="${path}">—</code>
                    </p>
                    <div class="d-flex gap-2 justify-content-center">
                        <a href="javascript:history.back()" class="btn btn-outline-secondary">
                            ← Назад
                        </a>
                        <a href="/" class="btn btn-primary">
                            Начална страница
                        </a>
                    </div>
                </div>
            </div>
            <p class="text-center text-muted small mt-3">
                Медицинска система &nbsp;·&nbsp; Грешка 404
            </p>
        </div>
    </div>
</div>

</body>
</html>
