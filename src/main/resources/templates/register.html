<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Медицинска система</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="text-center mb-4">
                <h2 class="fw-bold text-primary">Медицинска система</h2>
                <p class="text-muted small">Регистрация на нов пациент</p>
            </div>
            <div class="card shadow login-card">
                <div class="card-body p-4">
                    <h5 class="card-title mb-4">Регистрация</h5>
                    <div id="reg-success" class="alert alert-success d-none" role="alert">
                        Регистрацията е успешна. <a href="/login">Влезте в профила си.</a>
                    </div>
                    <div id="reg-error" class="alert alert-danger d-none" role="alert"></div>
                    <form id="reg-form">
                        <div class="row g-2 mb-3">
                            <div class="col">
                                <label for="firstName" class="form-label">Име <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="firstName" required maxlength="100">
                            </div>
                            <div class="col">
                                <label for="lastName" class="form-label">Фамилия <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="lastName" required maxlength="100">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="egn" class="form-label">ЕГН <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="egn"
                                   pattern="[0-9]{10}" maxlength="10" placeholder="10 цифри" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Имейл адрес <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" id="email"
                                   placeholder="потребител@example.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Парола <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" id="password"
                                   placeholder="Минимум 7 символа" minlength="7" required>
                        </div>
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Потвърди парола <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" id="confirmPassword"
                                   placeholder="••••••••" minlength="7" required>
                        </div>
                        <div class="mb-4">
                            <label for="personalDoctor" class="form-label">Личен лекар (ОПЛ)</label>
                            <select class="form-select" id="personalDoctor">
                                <option value="">— без личен лекар —</option>
                            </select>
                            <div class="form-text">Незадължително — може да бъде зададен по-късно.</div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100" id="reg-btn">Регистрация</button>
                    </form>
                </div>
            </div>
            <p class="text-center text-muted mt-3 small">
                Вече имате профил? <a href="/login">Влезте тук</a>
            </p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/auth.js"></script>
<script>
    // Зарежда ОПЛ лекарите за dropdown-а
    async function loadGpDoctors() {
        try {
            const r = await fetch('/api/doctors/gp');
            if (!r.ok) return;
            const doctors = await r.json();
            const sel = document.getElementById('personalDoctor');
            doctors.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d.id;
                opt.textContent = `Д-р ${d.firstName} ${d.lastName}`;
                sel.appendChild(opt);
            });
        } catch {
            // Не показваме грешка — dropdown-ът остава само с "без личен лекар"
        }
    }

    document.getElementById('reg-form').addEventListener('submit', async function (e) {
        e.preventDefault();

        const firstName = document.getElementById('firstName').value.trim();
        const lastName = document.getElementById('lastName').value.trim();
        const egn = document.getElementById('egn').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const personalDoctorId = document.getElementById('personalDoctor').value;

        const errorEl = document.getElementById('reg-error');
        const successEl = document.getElementById('reg-success');
        const btn = document.getElementById('reg-btn');

        errorEl.classList.add('d-none');
        successEl.classList.add('d-none');

        if (password !== confirmPassword) {
            errorEl.textContent = 'Паролата и потвърждението не съвпадат.';
            errorEl.classList.remove('d-none');
            return;
        }

        btn.textContent = 'Регистриране...';
        btn.disabled = true;

        const body = {
            firstName,
            lastName,
            egn,
            username: email,
            password
        };
        if (personalDoctorId) {
            body.personalDoctorId = parseInt(personalDoctorId);
        }

        try {
            const r = await fetch('/api/auth/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });

            if (r.status === 201) {
                document.getElementById('reg-form').reset();
                successEl.classList.remove('d-none');
                window.scrollTo(0, 0);
            } else {
                errorEl.textContent = await getErrorMessage(r);
                errorEl.classList.remove('d-none');
            }
        } catch {
            errorEl.textContent = 'Грешка при свързване с сървъра.';
            errorEl.classList.remove('d-none');
        } finally {
            btn.textContent = 'Регистрация';
            btn.disabled = false;
        }
    });

    loadGpDoctors();
</script>
</body>
</html>
